[project]
name = "pytoolbox-gui"
version = "0.0.0"
description = "Local web GUI for pytoolbox, started by `pytoolbox gui`."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pytoolbox",
    "uvicorn>=0.32",
]

[tool.uv.sources]
pytoolbox = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytoolbox_gui"]
