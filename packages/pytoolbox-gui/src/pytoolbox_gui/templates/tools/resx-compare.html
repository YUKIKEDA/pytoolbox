<header class="tool-header">
  <h1>{{ tool.name }}</h1>
  <p>{{ tool.summary }}</p>
</header>
{#- Posts when a path is committed: leaving the field, or Enter, which does not submit a form
    with two text fields and no button (docs/conventions.md, GUI HTTP). -#}
<form class="split" hx-post="/tools/resx-compare" hx-trigger="change, keyup[key=='Enter']"
      hx-sync="this:replace" hx-target="#resx-result">
  <section class="split-side">
    <h2><label for="resx-file1">File 1</label></h2>
    <input id="resx-file1" class="path-field" name="file1" spellcheck="false" autocomplete="off"
           placeholder="C:\path\to\Resources.resx" autofocus>
    <h2><label for="resx-file2">File 2</label></h2>
    <input id="resx-file2" class="path-field" name="file2" spellcheck="false" autocomplete="off"
           placeholder="C:\path\to\Resources.ja.resx">
  </section>
  <section id="resx-result" class="split-side tool-result" aria-live="polite">
    {%- include "tools/resx-compare-result.html" -%}
  </section>
</form>
