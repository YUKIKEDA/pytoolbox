{% from "macros.html" import clear_error %}
{% if count is defined %}{{ clear_error() }}{% endif %}
<dl class="counts">
  <div><dt>Characters</dt><dd>{{ count.total if count is defined else 0 }}</dd></div>
  <div><dt>Not white space</dt><dd>{{ count.non_space if count is defined else 0 }}</dd></div>
  <div><dt>Half-width</dt><dd>{{ count.half_width if count is defined else 0 }}</dd></div>
</dl>
