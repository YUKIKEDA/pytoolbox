[project]
name = "pytoolbox"
version = "0.0.0"
description = "Core library for the pytoolbox CLI."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pytoolbox = "pytoolbox.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytoolbox"]
